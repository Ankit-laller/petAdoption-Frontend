<div class="container-fluid d-flex justify-content-center align-items-center min-vh-100" 
  style="background: linear-gradient(102.87deg, #FCEED5 6.43%, #FCEED5 78.33%, #FFE7BA 104.24%);">
  
  <div class="row w-100 justify-content-center">
    
    <!-- Form Column -->
    <div class="col-12 col-md-6 col-lg-4">
      <div class="card p-4 shadow-lg">
        <form [formGroup]="user" class="needs-validation" (submit)="navigate()" novalidate>
          
          <!-- Header -->
          <h2 class="text-center mb-3 fs-responsive">Welcome</h2>
          <span class="text-center mb-3 fs-responsive text-muted">Register your account</span>

          <!-- Name -->
          <div class="mb-3">
            <label for="name-input" class="form-label">Name</label>
            <input type="text" class="form-control" id="name-input" placeholder="Enter name" required formControlName="name">
            <div class="invalid-feedback">Please enter your name.</div>
          </div>

          <!-- Email -->
          <div class="mb-3">
            <label for="email-input" class="form-label">Email address</label>
            <input type="email" class="form-control" id="email-input" placeholder="name@example.com" required formControlName="email">
            <div class="invalid-feedback">Please enter a valid email.</div>
          </div>

          <!-- Mobile Number -->
          <div class="mb-3">
            <label for="mobile-input" class="form-label">Mobile number</label>
            <input type="text" class="form-control" id="mobile-input" required formControlName="phoneNo">
            <div class="invalid-feedback">Please enter your mobile number.</div>
          </div>

          <!-- City -->
          <div class="mb-3">
            <label for="city-input" class="form-label">City</label>
            <input type="text" class="form-control" id="city-input" required formControlName="city">
            <div class="invalid-feedback">Please enter your city.</div>
          </div>

          <!-- Password -->
          <div class="mb-4">
            <label for="password-input" class="form-label">Password</label>
            <input type="password" class="form-control" id="password-input" required formControlName="password">
            <div class="invalid-feedback">Please enter a password.</div>
          </div>

          <!-- Register Button -->
          <div class="d-grid mb-3">
            <button class="btn btn-primary" type="submit">Register</button>
          </div>

          <!-- Login Link -->
          <div class="text-center">
            <a class="text-decoration-none" href="login" routerLinkActive="active-link">Already have an account?</a>
          </div>

        </form>
      </div>
    </div>

    <!-- Image Column (Only on md screens and above) -->
    <div class="col-md-6 d-none d-md-flex justify-content-center align-items-center">
      <img class="img-fluid rounded" src="./../../../assets/primary-image.png" alt="Image">
    </div>

  </div>
</div>
